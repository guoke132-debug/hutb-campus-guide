<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录 · 湖工商生活指南 CMS</title>
  <link rel="icon" href="assets/acm-logo.png">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap"></noscript>
</head>
<body class="admin-body">

<div class="auth-page">
  <div class="auth-card">
    <img src="assets/acm-logo.png" alt="华硕校园合伙人" class="auth-logo">
    <h2 class="auth-title">湖工商生活指南 CMS</h2>
    <p class="auth-sub">管理员登录</p>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username">账号</label>
        <input type="text" id="username" name="username" placeholder="请输入管理员账号" required autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" placeholder="请输入密码" required>
      </div>
      <div id="loginMsg" style="color:#e63946; font-size:0.85rem; text-align:center; margin-bottom:8px; display:none;"></div>
      <button type="submit" class="btn btn-accent" style="width:100%; padding: 12px;">
        🔓 登录后台
      </button>
    </form>

    <div class="auth-tip">
      🔒 联系 ACM 管理员获取账号密码
    </div>

    <div style="text-align:center; margin-top: var(--sp-4); font-size: 0.825rem;">
      <a href="index.html" style="color: var(--c-text-muted);">← 回到前台</a>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script>
  (async function() {
    if (await HUTBData.isLoggedIn()) {
      location.href = 'admin.html';
      return;
    }
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('loginMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = form.username.value.trim();
      const p = form.password.value;
      const btn = form.querySelector('button[type=submit]');
      btn.disabled = true;
      btn.textContent = '⏳ 登录中...';

      const r = await HUTBData.login(u, p);
      btn.disabled = false;
      btn.textContent = '🔓 登录后台';

      if (r && r.ok) {
        msg.style.color = '#2a9d8f';
        msg.textContent = '✅ 登录成功，跳转中...';
        msg.style.display = 'block';
        setTimeout(() => location.href = 'admin.html', 500);
      } else {
        msg.style.color = '#e63946';
        msg.textContent = r.message || '❌ 账号或密码错误';
        msg.style.display = 'block';
      }
    });
  })();
</script>
</body>
</html>
