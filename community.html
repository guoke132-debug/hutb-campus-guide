<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社区 · 湖工商生活指南</title>
  <link rel="icon" href="assets/acm-logo.png">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .redirect-container {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }
    .redirect-logo {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .redirect-title {
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 12px;
      color: var(--c-text);
    }
    .redirect-desc {
      font-size: 1rem;
      color: var(--c-text-muted);
      margin: 0 0 32px;
      max-width: 480px;
      line-height: 1.6;
    }
    .redirect-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .redirect-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
    .redirect-note {
      margin-top: 32px;
      padding: 16px 20px;
      background: var(--c-bg-soft);
      border-radius: 12px;
      font-size: 0.875rem;
      color: var(--c-text-muted);
      max-width: 480px;
    }
    .redirect-note strong {
      color: var(--c-text);
    }
    .redirect-timer {
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--c-text-muted);
    }
  </style>
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="topbar-logo">
      <img src="assets/acm-logo.png" alt="ACM"> 湖工商生活指南
    </a>
    <nav class="topbar-nav">
      <a href="index.html">首页</a>
      <a href="food.html">美食</a>
      <a href="travel.html">游玩</a>
      <a href="study.html">学习</a>
      <a href="freshman.html">迎新</a>
      <a href="community.html" class="active">社区</a>
    </nav>
    <div class="topbar-user"></div>
  </div>
</header>

<!-- 重定向提示区 -->
<main class="redirect-container">
  <img src="assets/acm-logo.png" alt="ACM" class="redirect-logo">
  <h1 class="redirect-title">🏠 湖工商社区</h1>
  <p class="redirect-desc">
    我们的社区已迁移至 <strong>BigPar 论坛</strong>，这是一个更大、更活跃的交流平台。<br>
    在那里你可以认识更多同学、参与话题讨论、分享校园生活。
  </p>
  <a href="https://www.bigpar.com/forum.php" class="redirect-btn" target="_blank">
    🚀 前往 BigPar 论坛
  </a>
  <p class="redirect-timer">
    页面将在 <span id="countdown">5</span> 秒后自动跳转...
  </p>
  <div class="redirect-note">
    <strong>💡 提示：</strong>BigPar 论坛需要单独注册账号，与本校网站账号不互通。<br>
    如需在 BigPar 认证学生身份，请关注论坛内的认证流程。
  </div>
</main>

<script>
(function() {
  let seconds = 5;
  const countdownEl = document.getElementById('countdown');

  const timer = setInterval(() => {
    seconds--;
    countdownEl.textContent = seconds;
    if (seconds <= 0) {
      clearInterval(timer);
      window.location.href = 'https://www.bigpar.com/forum.php';
    }
  }, 1000);
})();
</script>

</body>
</html>
